<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>판정관 검증</title>
<style>
  body { margin:0; font-family:"Malgun Gothic",system-ui,sans-serif; background:#fafafa; color:#1a1a1a;
         display:flex; justify-content:center; padding:32px 16px; }
  .wrap { width:100%; max-width:560px; }
  .bar { height:6px; background:#e0e0e0; border-radius:3px; overflow:hidden; margin-bottom:8px; }
  .bar > div { height:100%; background:#2f6fed; width:0%; transition:width .2s; }
  .meta { font-size:13px; color:#6b6b6b; margin-bottom:20px; display:flex; justify-content:space-between; }
  .card { background:#fff; border:1px solid #e0e0e0; border-radius:12px; padding:24px; text-align:center; }
  img { width:200px; height:200px; object-fit:contain; }
  .name { font-size:13px; color:#6b6b6b; margin-top:4px; }
  .ans { font-size:22px; font-weight:700; margin:18px 0 6px; }
  .q { font-size:14px; color:#6b6b6b; }
  .row { display:flex; gap:8px; margin-top:20px; }
  button { flex:1; padding:14px 8px; font-size:15px; font-family:inherit; border:1px solid #e0e0e0;
           background:#fff; border-radius:8px; cursor:pointer; line-height:1.5; }
  button small { display:block; color:#6b6b6b; font-size:12px; }
  .m { background:#e8f5e9; border-color:#a5d6a7; } .p { background:#fff8e1; border-color:#ffe082; }
  .x { background:#fdecea; border-color:#f5b7b1; } .sel { outline:3px solid #2f6fed; }
  .nav button { font-size:13px; padding:8px; color:#6b6b6b; margin-top:8px; }
  .done { margin-top:24px; padding:20px; background:#fff; border:1px solid #e0e0e0; border-radius:12px; font-size:14px; line-height:1.7; }
  .done button { background:#2f6fed; color:#fff; border-color:#2f6fed; font-weight:600; margin-top:8px; width:100%; }
  code { background:#f0f0f0; padding:2px 6px; border-radius:4px; font-size:13px; }
  .note { font-size:13px; color:#6b6b6b; line-height:1.7; margin-top:20px; }
</style></head><body><div class="wrap">
  <div class="bar"><div id="prog"></div></div>
  <div class="meta"><span id="count"></span><span id="judged"></span></div>
  <div class="card">
    <img id="icon" alt="">
    <div class="name">작가가 붙인 이름: <b id="name"></b></div>
    <div class="q" style="margin-top:16px">누군가 이 그림을 보고 이렇게 적었습니다</div>
    <div class="ans" id="ans"></div>
    <div class="row">
      <button class="m" id="b1">맞다<small>같은 물건 · 키 1</small></button>
      <button class="p" id="b2">비슷하지만 다른 물건<small>예: 단검→검 · 키 2</small></button>
      <button class="x" id="b3">틀리다<small>다른 물건/모르겠음 · 키 3</small></button>
    </div>
    <div class="nav"><button id="prev">← 이전으로</button></div>
  </div>
  <div class="done">다 하면 파일을 받아 <code>game-asset-rag\eval\</code> 에 넣으세요.
    <button id="download">judge_check.json 내려받기</button></div>
  <p class="note">
    <b>맞다</b>: 표현이 달라도 같은 물건(신발↔부츠, 포션↔물약병). 더 자세하거나 조금 더 일반적인 말도 포함.<br>
    <b>비슷하지만 다른 물건</b>: 큰 분류는 같은데 물건이 다름(반지↔팔찌, 투구↔갑옷).<br>
    <b>틀리다</b>: 아예 다른 물건이거나 "모르겠음".<br>
    누가 쓴 답인지, AI 판정관이 어떻게 판정했는지는 일부러 가렸습니다.
  </p>
</div>
<script>
const PAIRS = [{"key": "battle-axe ||| 위성", "icon": "itm_w014_battle-axe.png", "icon_name": "battle-axe", "answer": "위성"}, {"key": "turtle-shell ||| 거북이 등껍질 형태 방패", "icon": "itm_a003_turtle-shell.png", "icon_name": "turtle-shell", "answer": "거북이 등껍질 형태 방패"}, {"key": "sliced-bread ||| 발톱 또는 발", "icon": "itm_f001_sliced-bread.png", "icon_name": "sliced-bread", "answer": "발톱 또는 발"}, {"key": "camp-cooking-pot ||| 장작", "icon": "itm_f003_camp-cooking-pot.png", "icon_name": "camp-cooking-pot", "answer": "장작"}, {"key": "leather-armor ||| 흉갑", "icon": "itm_a018_leather-armor.png", "icon_name": "leather-armor", "answer": "흉갑"}, {"key": "bone-knife ||| 무기", "icon": "itm_w024_bone-knife.png", "icon_name": "bone-knife", "answer": "무기"}, {"key": "skull-mask ||| 해골", "icon": "itm_a013_skull-mask.png", "icon_name": "skull-mask", "answer": "해골"}, {"key": "drill ||| 공구", "icon": "itm_t007_drill.png", "icon_name": "drill", "answer": "공구"}, {"key": "primitive-necklace ||| 가시 구슬", "icon": "itm_c007_primitive-necklace.png", "icon_name": "primitive-necklace", "answer": "가시 구슬"}, {"key": "orb-wand ||| 돋보기 형태의 지팡이/도구", "icon": "itm_w040_orb-wand.png", "icon_name": "orb-wand", "answer": "돋보기 형태의 지팡이/도구"}, {"key": "lockpicks ||| 공구", "icon": "itm_t010_lockpicks.png", "icon_name": "lockpicks", "answer": "공구"}, {"key": "heart-bottle ||| 향수병", "icon": "itm_p011_heart-bottle.png", "icon_name": "heart-bottle", "answer": "향수병"}, {"key": "compass ||| 번개 문양 방패", "icon": "itm_c010_compass.png", "icon_name": "compass", "answer": "번개 문양 방패"}, {"key": "spotted-mushroom ||| 가스 마스크", "icon": "itm_m011_spotted-mushroom.png", "icon_name": "spotted-mushroom", "answer": "가스 마스크"}, {"key": "war-pick ||| 곡괭이", "icon": "itm_t004_war-pick.png", "icon_name": "war-pick", "answer": "곡괭이"}, {"key": "tied-scroll ||| 폭탄 또는 다이너마이트", "icon": "itm_s001_tied-scroll.png", "icon_name": "tied-scroll", "answer": "폭탄 또는 다이너마이트"}, {"key": "flanged-mace ||| 완드", "icon": "itm_w019_flanged-mace.png", "icon_name": "flanged-mace", "answer": "완드"}, {"key": "minerals ||| 결정체 군집", "icon": "itm_m006_minerals.png", "icon_name": "minerals", "answer": "결정체 군집"}, {"key": "crystal-wand ||| 체인 채찍", "icon": "itm_w038_crystal-wand.png", "icon_name": "crystal-wand", "answer": "체인 채찍"}, {"key": "wood-club ||| 가시 돋친 손톱 무기", "icon": "itm_w018_wood-club.png", "icon_name": "wood-club", "answer": "가시 돋친 손톱 무기"}, {"key": "shirt ||| 가죽갑옷", "icon": "itm_a016_shirt.png", "icon_name": "shirt", "answer": "가죽갑옷"}, {"key": "eye-shield ||| 문양 방패", "icon": "itm_a007_eye-shield.png", "icon_name": "eye-shield", "answer": "문양 방패"}, {"key": "powder-bag ||| 곡물 자루", "icon": "itm_m015_powder-bag.png", "icon_name": "powder-bag", "answer": "곡물 자루"}, {"key": "walking-boot ||| 갑옷 신발", "icon": "itm_a032_walking-boot.png", "icon_name": "walking-boot", "answer": "갑옷 신발"}, {"key": "templar-shield ||| 십자가 방패", "icon": "itm_a006_templar-shield.png", "icon_name": "templar-shield", "answer": "십자가 방패"}, {"key": "layered-armor ||| 겹겹이 방패", "icon": "itm_a022_layered-armor.png", "icon_name": "layered-armor", "answer": "겹겹이 방패"}, {"key": "plain-dagger ||| 활과 화살", "icon": "itm_w023_plain-dagger.png", "icon_name": "plain-dagger", "answer": "활과 화살"}, {"key": "wizard-staff ||| 소용돌이 에너지/마법 효과", "icon": "itm_w034_wizard-staff.png", "icon_name": "wizard-staff", "answer": "소용돌이 에너지/마법 효과"}, {"key": "bloody-sword ||| 화살촉과 동물 가죽 방패", "icon": "itm_w004_bloody-sword.png", "icon_name": "bloody-sword", "answer": "화살촉과 동물 가죽 방패"}, {"key": "battered-axe ||| 도끼", "icon": "itm_w017_battered-axe.png", "icon_name": "battered-axe", "answer": "도끼"}];
const KEY = "judge_check_v1";
let store = JSON.parse(localStorage.getItem(KEY) || "{}");
let i = 0;
const $ = id => document.getElementById(id);
const V = ["match", "partial", "miss"];
function render() {
  const p = PAIRS[i];
  $("icon").src = "../data/icons/" + p.icon;
  $("name").textContent = p.icon_name; $("ans").textContent = p.answer;
  $("count").textContent = (i + 1) + " / " + PAIRS.length;
  const n = PAIRS.filter(q => store[q.key]).length;
  $("judged").textContent = "채점 " + n + "건";
  $("prog").style.width = (100 * n / PAIRS.length) + "%";
  ["b1", "b2", "b3"].forEach((b, j) => $(b).classList.toggle("sel", store[p.key] === V[j]));
  $("prev").disabled = i === 0;
}
function judge(v) {
  store[PAIRS[i].key] = v; localStorage.setItem(KEY, JSON.stringify(store));
  if (i < PAIRS.length - 1) i++; render();
}
$("b1").onclick = () => judge("match"); $("b2").onclick = () => judge("partial"); $("b3").onclick = () => judge("miss");
$("prev").onclick = () => { if (i > 0) { i--; render(); } };
document.addEventListener("keydown", e => { if (["1", "2", "3"].includes(e.key)) judge(V[+e.key - 1]); });
$("download").onclick = () => {
  const out = {}; PAIRS.forEach(p => { if (store[p.key]) out[p.key] = store[p.key]; });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], {type: "application/json"}));
  a.download = "judge_check.json"; a.click();
};
render();
</script></body></html>
